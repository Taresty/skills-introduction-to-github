<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇小游戏</title>
<style>
  :root {
    --bg: #1e2130;
    --panel: #262a3d;
    --accent: #7ee787;
    --accent2: #ff7b9c;
    --text: #f0f0f5;
    --grid: #2c3049;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #2b2f45, var(--bg));
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 1px;
  }
  #panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 1rem;
    padding: 0 4px;
  }
  #hud span { color: var(--accent); font-weight: bold; }
  canvas {
    background: var(--grid);
    border-radius: 10px;
    display: block;
    touch-action: none;
  }
  #msg {
    min-height: 1.4em;
    font-size: 0.95rem;
    color: var(--accent2);
    text-align: center;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
    margin-top: 4px;
  }
  #controls button {
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    background: #333857;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  #controls button:active { background: var(--accent); color: #14161f; }
  #btn-up { grid-column: 2; grid-row: 1; }
  #btn-left { grid-column: 1; grid-row: 2; }
  #btn-down { grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #restart {
    margin-top: 4px;
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: #14161f;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95rem;
  }
  #restart:hover { filter: brightness(1.1); }
  footer {
    font-size: 0.8rem;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇小游戏 喵~</h1>
  <div id="panel">
    <div id="hud">
      <div>得分：<span id="score">0</span></div>
      <div>最高分：<span id="best">0</span></div>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <div id="msg">方向键 / WASD 控制方向，空格暂停</div>
    <div id="controls">
      <button id="btn-up">⬆️</button>
      <button id="btn-left">⬅️</button>
      <button id="btn-down">⬇️</button>
      <button id="btn-right">➡️</button>
    </div>
    <button id="restart">重新开始</button>
  </div>
  <footer>用方向键、WASD 或屏幕按钮来玩吧 (⁄ ⁄•⁄ω⁄•⁄ ⁄)</footer>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const restartBtn = document.getElementById('restart');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const BEST_KEY = 'snake-best-score';

  let snake, direction, nextDirection, food, score, best, gameOver, paused, loopId;

  function randomCell() {
    return {
      x: Math.floor(Math.random() * CELLS),
      y: Math.floor(Math.random() * CELLS),
    };
  }

  function placeFood() {
    let cell;
    do {
      cell = randomCell();
    } while (snake.some(s => s.x === cell.x && s.y === cell.y));
    food = cell;
  }

  function loadBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch (e) { /* ignore */ }
  }

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    gameOver = false;
    paused = false;
    placeFood();
    scoreEl.textContent = score;
    msgEl.textContent = '方向键 / WASD 控制方向，空格暂停';
    if (loopId) clearInterval(loopId);
    loopId = setInterval(tick, 110);
  }

  function endGame() {
    gameOver = true;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = best;
      msgEl.textContent = `游戏结束！新纪录 ${score} 分 🎉 点击"重新开始"再来一局`;
    } else {
      msgEl.textContent = `游戏结束！得分 ${score} 分，点击"重新开始"再来一局`;
    }
  }

  function tick() {
    if (paused || gameOver) return;
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      draw();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#2c3049';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.font = `${GRID}px serif`;
    ctx.textBaseline = 'top';
    ctx.fillText('🍎', food.x * GRID, food.y * GRID);

    // snake
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#7ee787' : '#4fae6e';
      const pad = 1;
      ctx.beginPath();
      const r = 5;
      const x = seg.x * GRID + pad;
      const y = seg.y * GRID + pad;
      const w = GRID - pad * 2;
      const h = GRID - pad * 2;
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.rect(x, y, w, h);
      }
      ctx.fill();
      if (isHead) {
        ctx.fillStyle = '#14161f';
        const eyeSize = 2;
        const ex = seg.x * GRID + (direction.x === -1 ? 4 : GRID - 6);
        const ey1 = seg.y * GRID + 5;
        const ey2 = seg.y * GRID + GRID - 7;
        if (direction.y !== 0) {
          ctx.fillRect(seg.x * GRID + 5, seg.y * GRID + (direction.y === -1 ? 4 : GRID - 6), eyeSize, eyeSize);
          ctx.fillRect(seg.x * GRID + GRID - 7, seg.y * GRID + (direction.y === -1 ? 4 : GRID - 6), eyeSize, eyeSize);
        } else {
          ctx.fillRect(ex, ey1, eyeSize, eyeSize);
          ctx.fillRect(ex, ey2, eyeSize, eyeSize);
        }
      }
    });

    if (paused && !gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2 - 12);
      ctx.textAlign = 'left';
    }
  }

  function setDirection(dx, dy) {
    if (gameOver) return;
    // Prevent reversing directly into itself
    if (snake.length > 1 && dx === -direction.x && dy === -direction.y) return;
    nextDirection = { x: dx, y: dy };
    if (paused) togglePause();
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    msgEl.textContent = paused ? '已暂停，按空格继续' : '加油喵～';
    draw();
  }

  const keyMap = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
      return;
    }
    const dir = keyMap[e.code];
    if (dir) {
      e.preventDefault();
      setDirection(dir[0], dir[1]);
    }
  });

  document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));
  restartBtn.addEventListener('click', reset);

  // simple swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  best = loadBest();
  bestEl.textContent = best;
  reset();
  draw();
})();
</script>
</body>
</html>
